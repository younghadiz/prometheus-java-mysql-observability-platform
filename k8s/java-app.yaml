apiVersion: v1
kind: ConfigMap
metadata:
  name: java-app-db-config
  namespace: default
data:
  DB_USER: appuser
  DB_SERVER: java-mysql-db-primary
  DB_NAME: teamdb

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-monitoring-app
  namespace: default
  labels:
    app: java-monitoring-app
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: java-monitoring-app

  template:
    metadata:
      labels:
        app: java-monitoring-app

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: java-app
          image: younghadiz/prometheus-java-mysql-app:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

            - name: metrics
              containerPort: 8081
              protocol: TCP

          envFrom:
            - configMapRef:
                name: java-app-db-config

          env:
            - name: DB_PWD
              valueFrom:
                secretKeyRef:
                  name: java-app-db-secret
                  key: DB_PWD

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: java-monitoring-app
  namespace: default
  labels:
    app: java-monitoring-app
spec:
  type: ClusterIP

  selector:
    app: java-monitoring-app

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP