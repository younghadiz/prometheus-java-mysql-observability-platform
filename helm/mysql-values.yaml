global:
  security:
    allowInsecureImages: true

architecture: replication

image:
  registry: docker.io
  repository: bitnamilegacy/mysql
  tag: 9.4.0-debian-12-r1
  pullPolicy: IfNotPresent

auth:
  database: teamdb
  username: appuser
  existingSecret: java-mysql-db-credentials

primary:
  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  podAntiAffinityPreset: soft

secondary:
  replicaCount: 1

  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  podAntiAffinityPreset: soft