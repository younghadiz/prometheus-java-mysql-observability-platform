---
- name: Deploy Java MySQL observability platform
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir }}/.."

  tasks:

    # -------------------------------------------------------------------------
    # Preflight checks
    # -------------------------------------------------------------------------

    - name: Verify Kubernetes cluster connectivity
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: cluster_nodes

    - name: Fail if no Kubernetes nodes are available
      ansible.builtin.assert:
        that:
          - cluster_nodes.resources | length > 0
        fail_msg: "No Kubernetes nodes were discovered. Verify kubeconfig and cluster context."
        success_msg: "Kubernetes cluster connectivity verified."

    # -------------------------------------------------------------------------
    # Helm repositories
    # -------------------------------------------------------------------------

    - name: Add Bitnami Helm repository
      kubernetes.core.helm_repository:
        name: bitnami
        repo_url: https://charts.bitnami.com/bitnami

    - name: Add ingress-nginx Helm repository
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx

    - name: Add Prometheus Community Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    # -------------------------------------------------------------------------
    # Monitoring stack first
    # Installs Prometheus Operator CRDs such as ServiceMonitor,
    # PrometheusRule and AlertmanagerConfig.
    # -------------------------------------------------------------------------

    - name: Deploy kube-prometheus-stack
      kubernetes.core.helm:
        name: monitoring
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: monitoring
        create_namespace: true
        values_files:
          - "{{ project_root }}/helm/kube-prometheus-stack-values.yaml"
        wait: true
        timeout: 15m

    # -------------------------------------------------------------------------
    # Verify required Prometheus Operator CRDs
    # -------------------------------------------------------------------------

    - name: Verify ServiceMonitor CRD exists
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: servicemonitors.monitoring.coreos.com
      register: servicemonitor_crd

    - name: Verify PrometheusRule CRD exists
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: prometheusrules.monitoring.coreos.com
      register: prometheusrule_crd

    - name: Verify AlertmanagerConfig CRD exists
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: alertmanagerconfigs.monitoring.coreos.com
      register: alertmanagerconfig_crd

    - name: Assert monitoring CRDs are installed
      ansible.builtin.assert:
        that:
          - servicemonitor_crd.resources | length == 1
          - prometheusrule_crd.resources | length == 1
          - alertmanagerconfig_crd.resources | length == 1
        fail_msg: "Required Prometheus Operator CRDs are missing."
        success_msg: "Prometheus Operator CRDs are available."

    # -------------------------------------------------------------------------
    # Required Secrets
    #
    # These secrets are intentionally NOT created by this playbook because
    # real credentials must not be stored in Git.
    # -------------------------------------------------------------------------

    - name: Check MySQL database credentials Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: default
        name: java-mysql-db-credentials
      register: mysql_credentials_secret

    - name: Check Java application database password Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: default
        name: java-app-db-secret
      register: java_db_secret

    - name: Check Alertmanager email Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: monitoring
        name: alertmanager-email-secret
      register: alertmanager_email_secret

    - name: Check Alertmanager Slack Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: monitoring
        name: alertmanager-slack-secret
      register: alertmanager_slack_secret

    - name: Assert required Secrets exist
      ansible.builtin.assert:
        that:
          - mysql_credentials_secret.resources | length == 1
          - java_db_secret.resources | length == 1
          - alertmanager_email_secret.resources | length == 1
          - alertmanager_slack_secret.resources | length == 1
        fail_msg: >-
          One or more required Kubernetes Secrets are missing.
          Create the database and Alertmanager Secrets securely before
          running this playbook.
        success_msg: "All required Kubernetes Secrets are present."

    # -------------------------------------------------------------------------
    # MySQL
    # -------------------------------------------------------------------------

    - name: Deploy MySQL replication architecture
      kubernetes.core.helm:
        name: java-mysql-db
        chart_ref: bitnami/mysql
        release_namespace: default
        values_files:
          - "{{ project_root }}/helm/mysql-values.yaml"
        wait: true
        timeout: 15m

    # -------------------------------------------------------------------------
    # Java application
    # -------------------------------------------------------------------------

    - name: Deploy Java application resources
      kubernetes.core.k8s:
        state: present
        src: "{{ project_root }}/k8s/java-app.yaml"
        wait: true
        wait_timeout: 300

    # -------------------------------------------------------------------------
    # NGINX Ingress
    # -------------------------------------------------------------------------

    - name: Deploy NGINX Ingress Controller
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: true
        values_files:
          - "{{ project_root }}/helm/ingress-nginx-values.yaml"
        wait: true
        timeout: 10m

    - name: Deploy application Ingress
      kubernetes.core.k8s:
        state: present
        src: "{{ project_root }}/k8s/ingress.yaml"

    # -------------------------------------------------------------------------
    # MySQL exporter
    # -------------------------------------------------------------------------

    - name: Deploy MySQL exporter
      kubernetes.core.helm:
        name: mysql-exporter
        chart_ref: prometheus-community/prometheus-mysql-exporter
        release_namespace: default
        values_files:
          - "{{ project_root }}/helm/mysql-exporter-values.yaml"
        wait: true
        timeout: 10m

    # -------------------------------------------------------------------------
    # Prometheus monitoring resources
    # -------------------------------------------------------------------------

    - name: Deploy Java ServiceMonitor
      kubernetes.core.k8s:
        state: present
        src: "{{ project_root }}/monitoring/java-app-servicemonitor.yaml"

    - name: Deploy Prometheus alert rules
      kubernetes.core.k8s:
        state: present
        src: "{{ project_root }}/monitoring/prometheus-rules.yaml"

    # -------------------------------------------------------------------------
    # Alertmanager routing
    # -------------------------------------------------------------------------

    - name: Deploy developer Slack routing
      kubernetes.core.k8s:
        state: present
        src: "{{ project_root }}/monitoring/alertmanager-slack.yaml"

    - name: Deploy Kubernetes admin email routing
      kubernetes.core.k8s:
        state: present
        src: "{{ project_root }}/monitoring/alertmanager-email.yaml"

    # -------------------------------------------------------------------------
    # Final validation
    # -------------------------------------------------------------------------

    - name: Get monitoring namespace pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: monitoring
      register: monitoring_pods

    - name: Display deployed monitoring pods
      ansible.builtin.debug:
        msg: >-
          {{ item.metadata.name }}
          - phase={{ item.status.phase }}
      loop: "{{ monitoring_pods.resources }}"